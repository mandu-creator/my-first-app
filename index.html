<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>도장 해빗 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style id="css">
/* Layout: 쿨그레이 바탕 위 크게 둥근 흰 카드 — 블루로 채운 "오늘 꼭 할 한 가지" 히어로 → 주간 도장 카드 → 분석 → 습관 관리 */
:root{
  --paper:#eceff4; --grid:#eceff4; --surface:#ffffff; --ink:#1d2640; --muted:#8a93a8; --line:#e4e8ef;
  --blush:#3b6fe5; --blush-soft:#e9effd; --cell:#f1f3f7; --stampbg:#f7f9fd; --ok:#2e9e6e; --warn:#c98a1b; --crit:#e5534b;
  --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(30,45,80,.04),0 14px 34px -16px rgba(30,45,80,.20);
  --f-hand:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12151c; --grid:#12151c; --surface:#1c212c; --ink:#e9edf5; --muted:#949db2; --line:#2b3240;
  --blush:#5b8af0; --blush-soft:#1f2b47; --cell:#252b38; --stampbg:#eef2fb; --ok:#5cc495; --warn:#e8b04f; --crit:#f07a72;
  --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 14px 34px -16px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12151c; --grid:#12151c; --surface:#1c212c; --ink:#e9edf5; --muted:#949db2; --line:#2b3240;
  --blush:#5b8af0; --blush-soft:#1f2b47; --cell:#252b38; --stampbg:#eef2fb; --ok:#5cc495; --warn:#e8b04f; --crit:#f07a72;
  --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 14px 34px -16px rgba(0,0,0,.6); color-scheme:dark}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:grid;gap:16px}
header h1{font-family:var(--f-hand);font-weight:700;font-size:clamp(36px,9vw,48px);line-height:1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:8px 0 0;font-size:14px}
.status{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range{font-family:var(--f-hand);font-size:26px;font-weight:700;line-height:1.1;flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--blush);border:1px solid var(--blush);border-radius:999px;padding:1px 8px}
.btn{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.btn:hover{border-color:var(--blush)}
.btn.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:20px;line-height:1}
.btn.primary{background:var(--blush);border-color:var(--blush);color:var(--surface);font-weight:600}
.btn.del.armed{background:var(--blush-soft);border-color:var(--blush);color:var(--blush);font-weight:600}
.btn:focus-visible,.slot:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blush);outline-offset:2px}
.summary{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--muted)}
.pill strong{font-family:var(--f-hand);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;margin:0 2px}
.done-banner{display:flex;gap:12px;align-items:center;background:var(--blush-soft);border-radius:14px;padding:10px 14px}
.done-banner .stamp{width:46px;height:52px;flex:none;transform:rotate(-10deg)}
.done-banner b{display:block;font-family:var(--f-hand);font-size:22px;line-height:1.1}
.done-banner span{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px 6px}
.gridwrap{overflow-x:auto}
table.week{border-collapse:separate;border-spacing:0;width:100%;min-width:330px;table-layout:fixed}
col.c-name{width:31%}
col.c-badge{width:40px}
th,td{padding:0;text-align:center}
thead th{font-weight:400;font-size:13px;color:var(--muted);padding:4px 0 8px;border-radius:10px 10px 0 0}
thead th.corner{text-align:left;padding-left:8px;vertical-align:bottom}
thead th b{display:block;font-family:var(--f-hand);font-size:22px;color:var(--ink);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
thead th.today b{color:var(--blush)}
th.today,td.today{background:var(--blush-soft)}
tbody tr:last-child td.today{border-radius:0 0 10px 10px}
tbody th{text-align:left;padding:8px 6px 8px 8px;font-weight:400;vertical-align:middle;border-top:1px solid var(--line)}
tbody td{border-top:1px solid var(--line);padding:7px 2px}
.hn{display:block;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.hc{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.hc.met{color:var(--ok);font-weight:600}
.slot{width:100%;max-width:34px;aspect-ratio:1;border-radius:9px;border:0;background:var(--cell);cursor:pointer;padding:0;display:grid;place-items:center;margin:0 auto}
.slot:hover:not(:disabled){box-shadow:0 0 0 2px var(--c,var(--blush))}
.slot.s-full,.sw.s-full{background:var(--c,var(--blush))}
.slot.s-mini,.sw.s-mini{background:color-mix(in srgb,var(--c,var(--blush)) 32%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c,var(--blush)) 55%,var(--surface))}
.slot.s-ten{background:transparent;box-shadow:0 0 0 2px var(--c,var(--blush))}
.slot.s-ten .stamp.ten{box-shadow:none;border-radius:9px}
.slot:disabled{opacity:.4;cursor:not-allowed}
.slot.just{animation:thump .56s cubic-bezier(.3,1.4,.5,1) both;position:relative;z-index:2}
@keyframes thump{0%{transform:translateY(-16px) scale(1.4) rotate(-10deg);box-shadow:0 16px 14px -8px rgba(20,25,35,.4)}
 36%{transform:translateY(0) scale(1.28,.68) rotate(0deg);box-shadow:none}
 54%{transform:scale(.86,1.14)}
 72%{transform:scale(1.07,.94) rotate(3deg)}
 88%{transform:scale(.98,1.02) rotate(-1deg)}
 100%{transform:none}}
.card.thud{animation:thud .3s ease-out .18s}
@keyframes thud{0%,100%{transform:none}35%{transform:translateY(2px)}70%{transform:translateY(-1px)}}
.fx{position:fixed;width:0;height:0;pointer-events:none;z-index:40;--rs:2.3}
.fx.big{--rs:3.4}
.fx .ring{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;border:3px solid var(--c);box-sizing:border-box;opacity:0;animation:ring .62s ease-out .18s forwards}
.fx .r2{animation-delay:.34s}
@keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(var(--rs));opacity:0}}
.fx .pt{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--c);opacity:0;animation:fly .72s cubic-bezier(.15,.8,.3,1) .18s forwards}
.fx .pt.sq{border-radius:2px}
.fx .pt.ln{width:12px;height:3px;top:-1.5px;left:-6px;border-radius:2px}
@keyframes fly{0%{transform:rotate(var(--a)) translateX(6px) scale(var(--s));opacity:1}75%{opacity:1}100%{transform:rotate(var(--a)) translateX(var(--d)) scale(.2);opacity:0}}
.fxlab{position:absolute;left:0;top:-34px;white-space:nowrap;font-family:var(--f-hand);font-size:24px;font-weight:700;color:var(--c);text-shadow:0 0 4px var(--surface),0 0 8px var(--surface);opacity:0;animation:lab 1.25s ease-out .2s forwards}
@keyframes lab{0%{transform:translate(-50%,10px) scale(.5);opacity:0}22%{transform:translate(-50%,0) scale(1.15);opacity:1}70%{transform:translate(-50%,-4px) scale(1);opacity:1}100%{transform:translate(-50%,-16px);opacity:0}}
.slot .stamp{width:100%;height:100%}
@keyframes press{0%{transform:scale(1.8) rotate(var(--r,0deg));opacity:0}60%{transform:scale(.88) rotate(var(--r,0deg));opacity:1}100%{transform:scale(1) rotate(var(--r,0deg))}}
.empty{margin:8px 8px 12px;color:var(--muted)}
details.manage{background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.manage summary{cursor:pointer;padding:12px 16px;font-family:var(--f-hand);font-size:22px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.manage summary::-webkit-details-marker{display:none}
details.manage summary::after{content:"+";font-family:var(--f-body);font-size:20px;color:var(--muted)}
details.manage[open] summary::after{content:"−"}
.mbody{padding:0 16px 16px;display:grid;gap:10px}
.mrow,.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.mbody input[type=text]{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%;box-sizing:border-box}
.goal{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.goal select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 4px}
.add{padding-top:4px;display:grid;gap:8px}
.mode{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mode>span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.seg label{position:relative;font-size:13px;padding:4px 12px;border-radius:999px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.seg label:has(input:checked){background:var(--blush);color:var(--surface);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--blush);outline-offset:2px}
.mitem{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mini{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.mini label{font-size:12px;color:var(--muted);white-space:nowrap}
.mbody .mini input[type=text]{font-size:14px;padding:6px 10px}
.chipbtn{font:inherit;font-size:12px;color:var(--blush);background:var(--blush-soft);border:1px solid transparent;border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.chipbtn:focus-visible{outline:2px solid var(--blush);outline-offset:2px}
.hm{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.hint{margin:0;font-size:12px;color:var(--muted)}
.analysis{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px}
.ahead{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.ahead h2{font-family:var(--f-hand);font-size:28px;margin:0;line-height:1}
.ahead span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--paper);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--muted)}
.stat span{display:block;font-size:12px}
.stat b{font-family:var(--f-hand);font-size:30px;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums;margin-right:2px}
.ah3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px}
.plot{position:relative;display:flex;gap:12px;align-items:flex-end;height:130px;padding-top:20px;border-bottom:1px solid var(--line)}
.goalline{position:absolute;left:0;right:0;top:20px;border-top:1px solid var(--line);pointer-events:none}
.goalline span{position:absolute;right:0;top:-17px;font-size:11px;color:var(--muted)}
.col{flex:1;max-width:76px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:default;border-radius:6px}
.col:hover,.col:focus-visible{background:var(--blush-soft)}
.col:focus-visible{outline:2px solid var(--blush);outline-offset:2px}
.fill{width:60%;min-height:2px;background:var(--blush);border-radius:4px 4px 0 0}
.col.cur .fill{background:color-mix(in srgb,var(--blush) 60%,var(--surface));border:1.5px solid var(--blush);border-bottom:0;box-sizing:border-box}
.vl{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:2px}
.xrow{display:flex;gap:12px;margin-top:4px}
.xrow span{flex:1;max-width:76px;text-align:center;font-size:12px;color:var(--muted)}
.readout{margin:6px 0 0;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;min-height:1.5em}
.hcards{display:grid;gap:10px}
.hcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hhead b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.crit{color:var(--crit)}.chip.new{color:var(--muted)}
.hline{margin:0;font-size:13px;color:var(--muted)}
.hline b{color:var(--ink);font-variant-numeric:tabular-nums}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.wdc{display:block;height:16px;border-radius:5px;margin:3px 0;border:1px solid var(--line);background:color-mix(in srgb,var(--blush) var(--a),var(--paper))}
.wdc.none{background:transparent;border-style:dashed}
.advice{margin:0;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{font-size:13px;padding:5px 12px}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.go{display:inline-block;margin-top:5px;font:inherit;font-size:12px;color:var(--blush);background:transparent;border:1px solid var(--blush);border-radius:999px;padding:1px 9px;cursor:pointer;white-space:nowrap}
.go:hover{background:var(--blush-soft)}
.go:focus-visible{outline:2px solid var(--blush);outline-offset:2px}
.timerbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(20,25,35,.12);padding:0 16px calc(12px + env(safe-area-inset-bottom,0px))}
.tprogw{height:4px;margin:0 -16px 10px;background:var(--blush-soft)}
.tprogw i{display:block;height:100%;background:var(--blush);transition:width .25s linear}
.tin{max-width:760px;margin:0 auto;padding-top:12px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 16px;align-items:center}
.tprogw + .tin{padding-top:0}
.tinfo{min-width:0;display:grid;gap:1px}
.tinfo b{font-family:var(--f-hand);font-size:24px;line-height:1.1;overflow-wrap:anywhere}
.tmini,.tmsg{font-size:12px;color:var(--muted)}
.ttime{font-family:var(--f-hand);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--blush)}
.tbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.timing .wrap{padding-bottom:190px}

.picker{position:absolute;z-index:30;min-width:176px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(20,25,35,.18);padding:6px;display:grid;gap:2px}
.picker .ph{font-size:12px;color:var(--muted);padding:4px 8px 6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.pbtn{display:flex;align-items:center;gap:10px;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;border-radius:10px;padding:8px;cursor:pointer;text-align:left}
.pbtn:hover,.pbtn:focus-visible{background:var(--blush-soft);outline:0}
.pbtn .sw{width:26px;height:26px;flex:none;margin:0;border-radius:7px}
.pbtn.cur{font-weight:600}
.pbtn.cur::after{content:"✓";margin-left:auto;color:var(--blush)}
.pbtn.clear{color:var(--muted);font-size:13px}
.pbtn.clear i{width:26px;text-align:center;font-style:normal}
.slot.picking{border-color:var(--blush);border-style:solid}
.bh{padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bcell{padding:4px 2px}
.stamp.badge{display:block;width:30px;height:30px;margin:0 auto}
.cntcell{padding:8px 4px}
.cbar{display:flex;align-items:center;gap:6px}
.cb{flex:none;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;line-height:1;cursor:pointer;padding:0}
.cb:hover:not(:disabled){border-color:var(--c)}
.cb:disabled{opacity:.35;cursor:not-allowed}
.cb:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.ctrack{position:relative;flex:1;height:22px;border-radius:999px;background:var(--cell);overflow:hidden}
.ctrack i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:999px;transition:width .25s}
.ctrack span{position:relative;display:block;text-align:center;font-size:12px;line-height:22px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.sw{display:inline-block;width:20px;height:20px;border-radius:6px;vertical-align:middle;margin-right:4px}
.lnote{flex-basis:100%}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px}
.kpi{text-align:center;display:grid;gap:2px}
.kpi b{font-size:clamp(30px,8vw,40px);line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.kpi b small{font-size:.42em;font-weight:600;margin-left:2px;color:var(--muted)}
.kpi span{font-size:12px;color:var(--muted)}
.k1 b{color:#3b6fe5}.k2 b{color:#2e9e6e}.k3 b{color:#f08a3c}.k4 b{color:#e5534b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .k1 b{color:#7ea3f5}:root:not([data-theme="light"]) .k2 b{color:#5cc495}:root:not([data-theme="light"]) .k3 b{color:#f5a865}:root:not([data-theme="light"]) .k4 b{color:#f07a72}}
:root[data-theme="dark"] .k1 b{color:#7ea3f5}:root[data-theme="dark"] .k2 b{color:#5cc495}:root[data-theme="dark"] .k3 b{color:#f5a865}:root[data-theme="dark"] .k4 b{color:#f07a72}
.swrow{display:flex;flex-wrap:wrap;gap:6px}
.swl{position:relative;width:22px;height:22px;border-radius:7px;background:var(--sw);cursor:pointer}
.swl input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.swl:has(input:checked){box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.swl:has(input:focus-visible){outline:2px solid var(--blush);outline-offset:4px}
.mbody input.emo{width:3.2em;text-align:center;padding:8px 4px}
.mitem{border-left:4px solid var(--c);padding-left:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);padding:2px 8px 8px}
.legend i{display:inline-block;width:20px;height:20px;vertical-align:middle;margin-right:4px}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}}
@media (max-width:420px){.mrow,.addrow{grid-template-columns:minmax(0,1fr) auto}.mrow .del,.addrow .btn{grid-column:1/-1}.mini{grid-template-columns:auto minmax(0,1fr)}.mini .chipbtn{grid-column:span 2;justify-self:start}}
@media (prefers-reduced-motion: reduce){.slot.just,.card.thud{animation:none}.fx{display:none}.tprogw i{transition:none}}

/* 확인 시간 · 오늘 꼭 할 한 가지 */
.ht{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.due .ht{color:#fff;background:var(--warn);border-color:var(--warn);font-weight:600}
.star{font:inherit;font-size:17px;line-height:1;color:var(--muted);background:none;border:0;padding:0 3px 0 0;cursor:pointer;vertical-align:-1px}
.star[aria-pressed="true"]{color:var(--blush)}
.star:focus-visible{outline:2px solid var(--blush);outline-offset:2px;border-radius:4px}
tr.focus th[scope=row]{background:var(--blush-soft);box-shadow:inset 4px 0 0 var(--blush)}
tr.focus .hn{font-weight:700}
.hero{position:relative;display:grid;gap:8px;background:var(--surface);border:2px solid var(--blush);border-radius:18px;padding:14px 16px 16px;box-shadow:5px 5px 0 var(--blush-soft)}
.hlab{justify-self:start;font-size:12px;font-weight:700;color:var(--surface);background:var(--blush);border-radius:999px;padding:3px 10px}
.htxt{font-family:var(--f-hand);font-weight:700;font-size:clamp(28px,7.5vw,38px);line-height:1.1;margin:0;overflow-wrap:anywhere}
.hsub{margin:0;font-size:13px;color:var(--muted)}
.hero.done{background:var(--blush-soft)}
.hero.done .htxt{padding-right:70px;text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--blush)}
.hero .stamp.big{position:absolute;right:14px;top:14px;width:60px;height:60px;--r:-12deg;transform:rotate(-12deg)}
.hero .stamp.big.press{animation:press .45s cubic-bezier(.2,.9,.3,1.3)}
.hacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;padding:6px 4px}
.hform{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.hform input{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.hform input:focus-visible{outline:2px solid var(--blush);outline-offset:2px}
.duebox{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:14px;padding:10px 12px;display:grid;gap:8px}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:2px 10px;flex-wrap:wrap}
.dh b{font-size:15px}.dh span{font-size:12px;color:var(--muted)}
.drow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.dn{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;overflow-wrap:anywhere}
.dn small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dd{order:1;flex-basis:100%;margin:-4px 0 0 18px;font-size:12px;color:var(--muted)}
@media (max-width:560px){td .hm.hd,th .hm.hd{display:none}}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.dacts{order:2;display:flex;gap:6px;margin-left:18px}

function setStatus(msg){
  if(!statusEl)return;
  statusEl.textContent=msg||(mode==='artifact'?'자동 저장':mode==='local'?'이 기기에만 저장돼요':mode==='readonly'?'보기 전용':'');

function buildDoc(){
  var css=document.getElementById('css').textContent,js=document.getElementById('app-js').textContent;
  var fonts=document.querySelector('link[rel="stylesheet"]').getAttribute('href');
  var s=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
   +'<title>도장 해빗 트래커</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="'+fonts.replace(/&/g,'&amp;')+'">\n'
   +'<style id="css">'+css+'</style>\n<div class="wrap" id="app"></div>\n'
   +'<script type="application/json" id="state">'+s+'<\/script>\n'

function save(delay){
  if(mode==='local'){lsSet('ht-state',JSON.stringify(state));setStatus('저장됨 (이 기기)');return}
  if(mode!=='artifact')return;
  clearTimeout(timer);setStatus('저장 대기 중…');
  timer=setTimeout(function(){
    setStatus('저장 중…');
    art.publish(buildDoc()).catch(function(e){
      var code=e&&e.code;
      if(code==='not_granted'||code==='not_writer'){mode='readonly';setStatus()}
      else if(code==='conflict')setStatus('다른 화면의 변경이 먼저 저장됐어요');
      else setStatus('저장하지 못했어요. 잠시 후 다시 눌러 주세요');
    });
  },delay);
}

  if(t.dataset&&t.dataset.color){hb=findHabit(t.dataset.color);if(!hb)return;hb.color=t.value;render();save(400);var fc=document.querySelector('input[name="color-'+hb.id+'"]:checked');if(fc)fc.focus();return}
  if(t.dataset&&t.dataset.emoji){hb=findHabit(t.dataset.emoji);if(!hb)return;var ev=Array.from(t.value.trim()).slice(0,4).join('');if(ev===(hb.emoji||''))return;hb.emoji=ev;render();save(400);return}
  if(t.name==='newmode'){newMode=t.value;var nr=document.getElementById('newminirow');if(nr){nr.hidden=newMode!=='mini'||newKind==='count';if(newMode==='mini'){var nmi=document.getElementById('newmini'),nn=document.getElementById('newname');if(nmi&&!nmi.value&&nn)nmi.value=suggestMini(nn.value)}}return}
  if(t.dataset&&t.dataset.mode){hb=findHabit(t.dataset.mode);if(!hb)return;hb.mode=t.value;if(hb.mode==='mini'&&!hb.mini){var sm2=suggestMini(hb.name);if(sm2)hb.mini=sm2}render();save(400);var fm=document.getElementById(hb.mode==='mini'?'mini-'+hb.id:'mode-'+hb.id);if(fm)fm.focus();return}
  if(t.dataset&&t.dataset.name){hb=findHabit(t.dataset.name);if(!hb)return;var v=t.value.trim().slice(0,30);if(!v){t.value=hb.name;return}if(v===hb.name)return;hb.name=v;render();save(400)}
  else if(t.dataset&&t.dataset.mini){hb=findHabit(t.dataset.mini);if(!hb)return;var mv=t.value.trim().slice(0,30);if(mv===(hb.mini||''))return;if(mv)hb.mini=mv;else delete hb.mini;render();save(400)}
  else if(t.dataset&&t.dataset.goal){hb=findHabit(t.dataset.goal);if(!hb)return;hb.goal=+t.value;render();save(400)}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='focusform'){e.preventDefault();var fin=document.getElementById('focusin'),fv=fin.value.trim().slice(0,40);if(!fv){fin.focus();return}state.focus[todayKey]={text:fv};trimFocus();render();save(400);return}
  if(e.target.id!=='addform')return;
  e.preventDefault();
  var inp=document.getElementById('newname'),v=inp.value.trim().slice(0,30);
  if(!v){inp.placeholder='습관 이름을 입력해 주세요';inp.focus();return}
  var nm=document.getElementById('newmini').value.trim().slice(0,30),nh={id:'h'+Date.now().toString(36),created:todayKey,name:v,goal:+document.getElementById('newgoal').value||3};
  nh.color=nextColor();nh.kind=newKind;
  nh.mode=newMode;if(newMode==='mini'&&newKind!=='count'){nm=nm||suggestMini(v);if(nm)nh.mini=nm}state.habits.push(nh);miniDirty=false;emoDirty=false;
  armed=null;render();var ni=document.getElementById('newname');if(ni)ni.focus();save(400);
});
var miniDirty=false,emoDirty=false;
document.addEventListener('input',function(e){
  if(e.target.id==='newname'){var mi=document.getElementById('newmini');if(mi&&!miniDirty)mi.value=suggestMini(e.target.value);var ne2=document.getElementById('newemoji');if(ne2&&!emoDirty)ne2.value=e.target.value.trim()?suggestEmoji(e.target.value):''}
  else if(e.target.id==='newemoji'){emoDirty=e.target.value.trim()!==''}
  else if(e.target.id==='newmini'){miniDirty=e.target.value.trim()!==''}
});
function readout(c){var r=document.getElementById('readout');if(r)r.textContent=c?c.dataset.tip:r.dataset.def}
document.addEventListener('mouseover',function(e){var c=e.target.closest&&e.target.closest('.col');if(c)readout(c)});
document.addEventListener('mouseout',function(e){var c=e.target.closest&&e.target.closest('.plot');if(c&&!c.contains(e.relatedTarget))readout(null)});
document.addEventListener('focusin',function(e){if(e.target.classList&&e.target.classList.contains('col'))readout(e.target)});
document.addEventListener('toggle',function(e){if(e.target.id==='manage')lsSet('ht-manage',e.target.open?'1':'0')},true);

render();
setInterval(function(){var n2=new Date(),k2=ymd(n2);if(k2!==todayKey){var wasThis=+view===+thisMon;now=n2;todayKey=k2;thisMon=mondayOf(n2);if(wasThis)view=thisMon;dueSig=''}if(dueKey()===dueSig)return;var ae=document.activeElement;if(pick||(ae&&ae.matches&&ae.matches('input,select,textarea')))return;render()},30000);
(window.claude&&window.claude.use?window.claude.use('artifact'):Promise.resolve(null)).then(function(a){
  if(a){art=a;mode='artifact'}
  else{
    mode='local';
    var saved=lsGet('ht-state');
    if(saved){try{state=JSON.parse(saved);normalize();render();return}catch(e){}}
  }
  setStatus();
}).catch(function(){mode='local';setStatus()});
})();
